# application.properties
spring.application.name=expensetrackerapi

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

app.mail.from=${MAIL_FROM}
brevo.api-key=${BREVO_API_KEY}

app.frontend-url=${FRONTEND_URL}

# Bound outbound HTTPS calls so a stalled provider does not hang password reset.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s
spring.http.clients.redirects=dont-follow
