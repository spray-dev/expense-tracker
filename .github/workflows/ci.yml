name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expensetrackerapi
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: expense_tracker_ci
          POSTGRES_USER: expense_tracker_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_tracker_ci -d expense_tracker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/expense_tracker_ci
      DB_USERNAME: expense_tracker_ci
      DB_PASSWORD: ci-only-password
      JWT_SECRET: VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JKV1RUZXN0aW5nMTIzNDU2Nzg5MA==
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: expensetrackerapi/pom.xml
      - name: Verify Docker for Testcontainers
        run: docker info
      - name: Compile, test, and package
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: expensetrackerapi/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: expensetrackerweb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: expensetrackerweb/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
